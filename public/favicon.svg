<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="62%" stop-color="#0b1224" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="amberFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <pattern id="batteryBars" width="64" height="3.8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="64" height="1.25" fill="#090f1e" fill-opacity="0.72"/>
    </pattern>

    <clipPath id="bodyClip">
      <path transform="translate(15.6, 2.2) scale(0.149)" d="M 110 34 C 122 34, 130 43, 130 56 C 130 67, 123 76, 118 79 L 118 89 C 135 92, 152 98, 159 112 L 176 196 C 178 205, 173 211, 167 211 C 161 211, 158 206, 156 197 L 144 134 L 140 198 L 144 242 L 149 384 C 149 394, 144 400, 136 400 C 128 400, 124 394, 123 384 L 115 266 L 110 258 L 105 266 L 97 384 C 96 394, 92 400, 84 400 C 76 400, 71 394, 71 384 L 76 242 L 80 198 L 76 134 L 64 197 C 62 206, 59 211, 53 211 C 47 211, 42 205, 44 196 L 61 112 C 68 98, 85 92, 102 89 L 102 79 C 97 76, 90 67, 90 56 C 90 43, 98 34, 110 34 Z"/>
    </clipPath>
  </defs>

  <!-- Dark rounded square icon canvas -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle foot ring -->
  <ellipse cx="32" cy="60.8" rx="10.5" ry="1.8" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.9"/>

  <!-- Dark body base -->
  <path transform="translate(15.6, 2.2) scale(0.149)" d="M 110 34 C 122 34, 130 43, 130 56 C 130 67, 123 76, 118 79 L 118 89 C 135 92, 152 98, 159 112 L 176 196 C 178 205, 173 211, 167 211 C 161 211, 158 206, 156 197 L 144 134 L 140 198 L 144 242 L 149 384 C 149 394, 144 400, 136 400 C 128 400, 124 394, 123 384 L 115 266 L 110 258 L 105 266 L 97 384 C 96 394, 92 400, 84 400 C 76 400, 71 394, 71 384 L 76 242 L 80 198 L 76 134 L 64 197 C 62 206, 59 211, 53 211 C 47 211, 42 205, 44 196 L 61 112 C 68 98, 85 92, 102 89 L 102 79 C 97 76, 90 67, 90 56 C 90 43, 98 34, 110 34 Z" fill="#131c31"/>

  <!-- Clipped golden battery wave fill + segmented scanline bars -->
  <g clip-path="url(#bodyClip)">
    <path d="M 0 30 Q 16 28 32 30 T 64 30 L 64 64 L 0 64 Z" fill="url(#amberFill)"/>
    <rect x="0" y="0" width="64" height="64" fill="url(#batteryBars)"/>
  </g>

  <!-- Glowing golden silhouette outline -->
  <path transform="translate(15.6, 2.2) scale(0.149)" d="M 110 34 C 122 34, 130 43, 130 56 C 130 67, 123 76, 118 79 L 118 89 C 135 92, 152 98, 159 112 L 176 196 C 178 205, 173 211, 167 211 C 161 211, 158 206, 156 197 L 144 134 L 140 198 L 144 242 L 149 384 C 149 394, 144 400, 136 400 C 128 400, 124 394, 123 384 L 115 266 L 110 258 L 105 266 L 97 384 C 96 394, 92 400, 84 400 C 76 400, 71 394, 71 384 L 76 242 L 80 198 L 76 134 L 64 197 C 62 206, 59 211, 53 211 C 47 211, 42 205, 44 196 L 61 112 C 68 98, 85 92, 102 89 L 102 79 C 97 76, 90 67, 90 56 C 90 43, 98 34, 110 34 Z" fill="none" stroke="#fbbf24" stroke-width="11" stroke-linejoin="round"/>

  <!-- Rose heart target dot & ring -->
  <circle cx="33.8" cy="22.5" r="3.4" fill="none" stroke="#f43f5e" stroke-width="1.35"/>
  <circle cx="33.8" cy="22.5" r="1.5" fill="#fb7185"/>
</svg>
